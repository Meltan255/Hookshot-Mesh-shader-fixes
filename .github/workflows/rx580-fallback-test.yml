name: RX 580 WebGPU fallback test DLL

on:
  push:
    branches:
      - research/rx580-compute-mesh-fallback
    paths:
      - gpu/vk/**
      - nx2/build.py
      - scripts/linux/deps.sh
      - .github/workflows/rx580-fallback-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rx580-fallback-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-dll:
    name: Build test Vulkan DLL (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install LLVM toolchain
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Fetch Vulkan build headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "build-deps\cpm"
          $packages = @(
            @{ Name = "vulkanheaders"; Tag = "v1.4.345"; Repo = "KhronosGroup/Vulkan-Headers" },
            @{ Name = "spirv-headers"; Tag = "vulkan-sdk-1.4.341.0"; Repo = "KhronosGroup/SPIRV-Headers" },
            @{ Name = "vulkanmemoryallocator"; Tag = "v3.3.0"; Repo = "GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator" }
          )
          foreach ($p in $packages) {
            $dest = Join-Path $root (Join-Path $p.Name $p.Tag)
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP ($p.Name + ".tar.gz")
            $url = "https://github.com/$($p.Repo)/archive/refs/tags/$($p.Tag).tar.gz"
            Invoke-WebRequest -Uri $url -OutFile $archive
            tar -xzf $archive -C $dest --strip-components=1
          }

      - name: Compile renderer DLL only
        shell: pwsh
        env:
          RX_VK_ONLY: "1"
          RX_CPM: ${{ github.workspace }}\build-deps\cpm
          RX_JOBS: "3"
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:EMSDK) { throw "EMSDK was not configured by setup-emsdk" }
          python -I nx2/build.py --standalone --jobs 3
          $dll = "work/sa/build/hookshot_vk.dll"
          if (-not (Test-Path $dll)) { throw "Renderer DLL was not produced: $dll" }

      - name: Package test build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "rx580-webgpu-fallback"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "work/sa/build/hookshot_vk.dll" $stage
          @'
          RX 580 WebGPU fallback test build
          =================================

          This is a TEST renderer DLL, not a complete mesh-shader emulation.

          Install:
          1. Close Hookshot.
          2. Back up the existing hookshot_vk.dll in your game folder.
          3. Copy this hookshot_vk.dll beside hookshot.exe.
          4. Open hookshot_env.txt beside hookshot.exe (create it if absent) and add:
             RX_VK_FALLBACK_NO_MESH=1
          5. Start Hookshot and test the same scene.

          Expected test behavior:
          - On a GPU without VK_EXT_mesh_shader + meshShader + taskShader, the Vulkan DLL
            declines startup and Hookshot's existing WebGPU renderer is selected.
          - WebGPU can render ordinary vertex/fragment/compute work, but it does NOT recreate
            geometry generated by NVN task/mesh shaders. Some objects/vegetation may remain missing.
          - This test checks whether the regular rendering path improves the UI/scene and gives
            us a clean comparison log. It is not the final compute-to-vertex fallback.

          To undo:
          - Restore your backed-up hookshot_vk.dll.
          - Remove RX_VK_FALLBACK_NO_MESH=1 from hookshot_env.txt.
          '@ | Set-Content -Encoding UTF8 (Join-Path $stage "README-test.txt")
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $env:RUNNER_TEMP "RX580-WebGPU-fallback-test.zip") -Force

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: RX580-WebGPU-fallback-test
          path: ${{ runner.temp }}\RX580-WebGPU-fallback-test.zip
          if-no-files-found: error
          retention-days: 30
