name: RX 580 Hookshot Builder test package

on:
  push:
    branches:
      - research/rx580-compute-mesh-fallback
      - research/rx580-task-compute-fallback
    paths:
      - gpu/**
      - host/**
      - nx2/**
      - third_party/**
      - builder/**
      - .github/workflows/rx580-fallback-test.yml
      - docs/rx580-fallback-test.md
      - tests/test_rx580_mesh_compute_dispatch.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rx580-fallback-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-builder:
    name: Build Windows HookshotBuilder.zip
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish HookshotBuilder.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publish = Join-Path $env:RUNNER_TEMP "builder-publish"
          dotnet publish builder/HookshotBuilder/HookshotBuilder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o $publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          if (-not (Test-Path (Join-Path $publish "HookshotBuilder.exe"))) { throw "HookshotBuilder.exe was not produced" }

      - name: Download the full Builder tools bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "HookshotBuilder-upstream.zip"
          $extract = Join-Path $env:RUNNER_TEMP "HookshotBuilder-upstream"
          $url = "https://github.com/NotRexed/Hookshot/releases/download/foliage-linux-updater/HookshotBuilder.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force

          $builderExe = Get-ChildItem -LiteralPath $extract -Filter "HookshotBuilder.exe" -File -Recurse | Select-Object -First 1
          if (-not $builderExe) { throw "The upstream package does not contain HookshotBuilder.exe" }
          $packageRoot = $builderExe.Directory.FullName
          $tools = Join-Path $packageRoot "tools"
          if (-not (Test-Path (Join-Path $tools "nx2/make_game.py"))) { throw "The downloaded zip does not contain tools/nx2/make_game.py beside Builder.exe" }
          if (-not (Test-Path (Join-Path $tools "python/python.exe"))) { throw "The full Python runtime is missing from the upstream tools bundle" }
          if (-not (Test-Path (Join-Path $tools "emsdk/upstream/bin/clang.exe"))) { throw "The bundled LLVM compiler is missing" }
          if (-not (Test-Path (Join-Path $tools "cpm/vulkanheaders"))) { throw "Vulkan-Headers are missing from tools/cpm" }
          if (-not (Test-Path (Join-Path $tools "cpm/spirv-headers"))) { throw "SPIRV-Headers are missing from tools/cpm" }

          "PACKAGE_ROOT=$packageRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TOOLS_ROOT=$tools" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Found Builder package: $packageRoot"

      - name: Overlay this fork's current source into tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $names = @("nx2", "host", "gpu", "third_party", "assets")
          foreach ($name in $names) {
            $source = Join-Path $env:GITHUB_WORKSPACE $name
            $dest = Join-Path $env:TOOLS_ROOT $name
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            robocopy $source $dest /E /NFL /NDL /NJH /NJS /NP /R:2 /W:1 | Out-Null
            $copyExit = $LASTEXITCODE
            if ($copyExit -ge 8) { throw "Could not overlay source folder $name (robocopy exit $copyExit)" }
            $global:LASTEXITCODE = 0
          }
          Copy-Item LICENSE (Join-Path $env:TOOLS_ROOT "LICENSE") -Force
          Copy-Item readme.md (Join-Path $env:TOOLS_ROOT "readme.md") -Force
          Write-Host "Updated source copied; packaged compiler, Python, SDL and WGPU binaries were preserved."

      - name: Check 3D mesh-compute fallback wiring
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $env:TOOLS_ROOT "python/python.exe"
          & $python -I -B (Join-Path $env:GITHUB_WORKSPACE "tests/test_rx580_mesh_compute_dispatch.py")
          if ($LASTEXITCODE -ne 0) { throw "The mesh-compute source regression check failed" }

      - name: Compile the changed Vulkan renderer as a build check
        shell: pwsh
        env:
          RX_VK_ONLY: "1"
          RX_JOBS: "3"
        run: |
          $ErrorActionPreference = "Stop"
          $env:EMSDK = Join-Path $env:TOOLS_ROOT "emsdk"
          $env:RX_CPM = Join-Path $env:TOOLS_ROOT "cpm"
          $env:OOT_WORK = Join-Path $env:RUNNER_TEMP "rx580-renderer-build"
          $python = Join-Path $env:TOOLS_ROOT "python/python.exe"
          $script = Join-Path $env:TOOLS_ROOT "nx2/build.py"
          & $python -I $script --standalone --jobs 3
          if ($LASTEXITCODE -ne 0) { throw "The Vulkan renderer did not compile" }
          $dll = Join-Path $env:OOT_WORK "sa/build/hookshot_vk.dll"
          if (-not (Test-Path $dll)) { throw "Renderer compile completed without producing hookshot_vk.dll" }
          Write-Host ("Renderer compile passed: {0:N1} MB" -f ((Get-Item $dll).Length / 1MB))

      - name: Assemble the Builder ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publish = Join-Path $env:RUNNER_TEMP "builder-publish"
          Copy-Item (Join-Path $publish "*") $env:PACKAGE_ROOT -Recurse -Force

          $version = "rx580-builder-test-$env:GITHUB_RUN_NUMBER"
          Set-Content -LiteralPath (Join-Path $env:TOOLS_ROOT "version.txt") -Value $version -Encoding ascii

          @'
          RX 580 Hookshot Builder test package
          ===================================

          This is the Windows Hookshot Builder application package, not a prebuilt game.
          Extract the whole ZIP, keep the tools folder beside HookshotBuilder.exe, and run
          HookshotBuilder.exe. It builds from your own supported game files on your PC.
          No game dump, keys, generated game executable or saves are included.

          RX 580 compute-fallback test:
          1. Use Builder to build your own game folder.
          2. You may create hookshot_env.txt beside hookshot.exe and add:
                 HOOKSHOT_NO_UPDATE_CHECK=1
             Do NOT set RX_VK_FALLBACK_NO_MESH; that setting bypasses Vulkan and uses WebGPU.
          3. Start hookshot.exe and test the menu and the same scene as before.
          4. Send back hookshot_log.txt and describe what appears or is missing.

          What this experiment does:
          On GPUs without VK_EXT_mesh_shader, Vulkan attempts compute-based emulation for
          eligible direct one-dimensional mesh draws, both with and without a task stage.
          For task+mesh draws, task compute writes each task workgroup's emitted-child count
          and shared payload to a GPU buffer. Mesh compute reads those records, runs a bounded
          child fan-out, writes generated vertices and indirect draw commands, then a
          conventional vertex/fragment pipeline renders the generated geometry.
          RX_VK_TASK_CAP controls the maximum child slots per task; by default it uses the
          task shader's X workgroup size. Culled child slots are rendered as empty draws.

          Important limitations:
          This is an experimental partial fallback, not a complete mesh-shader replacement.
          Only direct one-dimensional task/mesh dispatches are accepted; indirect task/mesh
          dispatches, multidimensional task grids and unsupported mesh output built-ins are
          skipped. Task or mesh shaders with external memory, storage-buffer, image or atomic
          side effects are rejected because the bounded fan-out can execute culled child slots.
          Shader code still runs for those empty slots, so this is not identical to native
          variable-size dispatch. Some geometry or effects may remain missing. A successful
          Windows compile does not prove correct rendering; actual RX 580 testing is required.
          '@ | Set-Content -LiteralPath (Join-Path $env:PACKAGE_ROOT "README-RX580-test.txt") -Encoding UTF8

          $stage = Join-Path $env:RUNNER_TEMP "package-root"
          $folder = Join-Path $stage "HookshotBuilder"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item (Join-Path $env:PACKAGE_ROOT "*") $folder -Recurse -Force

          $zip = Join-Path $env:RUNNER_TEMP "HookshotBuilder.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          if (-not (Test-Path $zip)) { throw "HookshotBuilder.zip was not created" }

          $check = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $required = @("HookshotBuilder/HookshotBuilder.exe", "HookshotBuilder/tools/nx2/make_game.py", "HookshotBuilder/tools/python/python.exe", "HookshotBuilder/tools/version.txt", "HookshotBuilder/README-RX580-test.txt")
            foreach ($entry in $required) {
              if (-not ($check.Entries | Where-Object { $_.FullName -eq $entry })) { throw "ZIP is missing $entry" }
            }
          } finally {
            $check.Dispose()
          }
          Write-Host ("Packaged {0:N1} MB" -f ((Get-Item $zip).Length / 1MB))

      - name: Upload Builder test artifact
        uses: actions/upload-artifact@v4
        with:
          name: RX580-HookshotBuilder-test
          path: ${{ runner.temp }}\HookshotBuilder.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease Builder asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rx580-builder-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: RX 580 Hookshot Builder test ${{ github.run_number }}
          body: |
            Experimental Windows Hookshot Builder package for RX 580 testing.

            This release contains the Builder application and its full tools folder. It does not contain a game, game dump, keys, generated game executable or saves.

            This experimental build keeps Vulkan active when VK_EXT_mesh_shader is unavailable and attempts compute-to-vertex emulation for eligible direct one-dimensional mesh draws, with or without a task stage. The task path stores emitted-child counts and shared payload in a GPU buffer, then dispatches a bounded number of mesh compute workgroups and emits generated vertices plus indirect draws. RX_VK_TASK_CAP sets the child-slot cap (default: task workgroup X size). Only direct 1D task/mesh draws are accepted; indirect draws, unsupported mesh outputs and task/mesh shaders with external memory, storage-buffer, image or atomic side effects are skipped. Empty child slots still execute shader code, so behavior is not identical to native variable-size dispatch. RX_VK_FALLBACK_NO_MESH must be left unset; setting it bypasses Vulkan and hands off to WebGPU. Windows compile passed; RX 580 gameplay testing remains required.
          prerelease: true
          draft: false
          make_latest: false
          files: ${{ runner.temp }}\HookshotBuilder.zip
